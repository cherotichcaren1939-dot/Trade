<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.active {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .add-timezone-form {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .add-timezone-form select,
        .add-timezone-form input {
            padding: 10px 15px;
            border: 2px solid white;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .add-timezone-form select::placeholder,
        .add-timezone-form input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .add-timezone-form select option {
            background: #1e3c72;
            color: white;
        }

        .add-timezone-form select option:hover {
            background: #2a5298;
        }

        .add-timezone-form button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .add-timezone-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .clock-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0%, 100% {
                transform: translateX(-100%);
            }
            50% {
                transform: translateX(100%);
            }
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .timezone-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timezone-region {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 15px;
            font-style: italic;
        }

        .time-display {
            font-size: 48px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .time-display.blinking {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49%, 100% {
                opacity: 1;
            }
            50%, 99% {
                opacity: 0.7;
            }
        }

        .date-display {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .day-display {
            font-size: 13px;
            opacity: 0.8;
            margin-bottom: 15px;
        }

        .period {
            font-size: 14px;
            font-weight: 700;
            opacity: 0.9;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
        }

        .offset {
            font-size: 11px;
            opacity: 0.7;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .remove-btn {
            background: rgba(239, 68, 68, 0.8);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 10px;
            width: 100%;
        }

        .remove-btn:hover {
            background: rgba(239, 68, 68, 1);
            transform: scale(1.02);
        }

        .format-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .format-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 13px;
        }

        .format-btn.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .stats {
            text-align: center;
            color: white;
            font-size: 13px;
            opacity: 0.8;
            margin-top: 30px;
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 50px 20px;
        }

        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .empty-state p {
            font-size: 14px;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }

            .time-display {
                font-size: 36px;
            }

            .add-timezone-form {
                flex-direction: column;
            }

            .add-timezone-form select,
            .add-timezone-form input,
            .add-timezone-form button {
                width: 100%;
            }
        }

        .success-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(34, 197, 94, 0.9);
            color: white;
            padding: 15px 20px;
            border-radius: 6px;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🌍 Multi-Timezone Clock</h1>
            <p>Track time across different regions of the world</p>
        </div>

        <!-- Format Toggle -->
        <div class="format-toggle">
            <button class="format-btn active" onclick="toggleFormat('24')">24-Hour</button>
            <button class="format-btn" onclick="toggleFormat('12')">12-Hour</button>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn active" onclick="showPresets()">📌 Quick Add</button>
            <button class="btn" onclick="clearAll()">🗑️ Clear All</button>
            <button class="btn" onclick="toggleBlinking()">⚡ Toggle Blink</button>
        </div>

        <!-- Add Timezone Form -->
        <div class="add-timezone-form">
            <input type="text" id="customTimezone" placeholder="e.g., Europe/London" list="timezoneList">
            <datalist id="timezoneList">
                <option value="Africa/Johannesburg">
                <option value="Africa/Lagos">
                <option value="Africa/Cairo">
                <option value="Africa/Nairobi">
                <option value="America/New_York">
                <option value="America/Los_Angeles">
                <option value="America/Chicago">
                <option value="America/Denver">
                <option value="America/Toronto">
                <option value="America/Mexico_City">
                <option value="America/Sao_Paulo">
                <option value="America/Buenos_Aires">
                <option value="Europe/London">
                <option value="Europe/Paris">
                <option value="Europe/Berlin">
                <option value="Europe/Madrid">
                <option value="Europe/Rome">
                <option value="Europe/Amsterdam">
                <option value="Europe/Moscow">
                <option value="Europe/Istanbul">
                <option value="Asia/Dubai">
                <option value="Asia/Kolkata">
                <option value="Asia/Bangkok">
                <option value="Asia/Singapore">
                <option value="Asia/Hong_Kong">
                <option value="Asia/Tokyo">
                <option value="Asia/Seoul">
                <option value="Asia/Shanghai">
                <option value="Australia/Sydney">
                <option value="Australia/Melbourne">
                <option value="Australia/Perth">
                <option value="Pacific/Auckland">
                <option value="Pacific/Fiji">
            </datalist>
            <button onclick="addCustomTimezone()">➕ Add Timezone</button>
        </div>

        <!-- Presets Menu -->
        <div id="presetsMenu" style="display: none; text-align: center; margin-bottom: 20px;">
            <div class="controls">
                <button class="btn" onclick="addPreset('Africa/Nairobi')">🇰🇪 Nairobi (EAT)</button>
                <button class="btn" onclick="addPreset('Europe/London')">🇬🇧 London (GMT)</button>
                <button class="btn" onclick="addPreset('America/New_York')">🇺🇸 New York (EST)</button>
                <button class="btn" onclick="addPreset('Asia/Tokyo')">🇯🇵 Tokyo (JST)</button>
                <button class="btn" onclick="addPreset('Australia/Sydney')">🇦🇺 Sydney (AEDT)</button>
                <button class="btn" onclick="addPreset('Asia/Dubai')">🇦🇪 Dubai (GST)</button>
            </div>
        </div>

        <!-- Clocks Grid -->
        <div class="clocks-grid" id="clocksContainer">
            <!-- Clock cards will be inserted here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state">
            <h2>🕐 No Timezones Added</h2>
            <p>Click "📌 Quick Add" to add popular timezones, or enter a custom timezone above!</p>
        </div>

        <!-- Stats -->
        <div class="stats">
            <p id="statsText">0 timezones active</p>
        </div>
    </div>

    <script>
        // Global variables
        let timezones = JSON.parse(localStorage.getItem('timezones')) || [];
        let timeFormat = localStorage.getItem('timeFormat') || '24';
        let isBlinking = localStorage.getItem('isBlinking') === 'true';

        // List of all available timezones
        const allTimezones = [
            'Africa/Johannesburg', 'Africa/Lagos', 'Africa/Cairo', 'Africa/Nairobi',
            'America/New_York', 'America/Los_Angeles', 'America/Chicago', 'America/Denver',
            'America/Toronto', 'America/Mexico_City', 'America/Sao_Paulo', 'America/Buenos_Aires',
            'Europe/London', 'Europe/Paris', 'Europe/Berlin', 'Europe/Madrid', 'Europe/Rome',
            'Europe/Amsterdam', 'Europe/Moscow', 'Europe/Istanbul',
            'Asia/Dubai', 'Asia/Kolkata', 'Asia/Bangkok', 'Asia/Singapore', 'Asia/Hong_Kong',
            'Asia/Tokyo', 'Asia/Seoul', 'Asia/Shanghai',
            'Australia/Sydney', 'Australia/Melbourne', 'Australia/Perth',
            'Pacific/Auckland', 'Pacific/Fiji'
        ];

        // Initialize
        function init() {
            renderClocks();
            updateStats();
            setInterval(renderClocks, 1000);
            setBlinkingState();
        }

        // Render all clock cards
        function renderClocks() {
            const container = document.getElementById('clocksContainer');
            const emptyState = document.getElementById('emptyState');

            if (timezones.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            container.innerHTML = timezones.map(tz => createClockCard(tz)).join('');
        }

        // Create a clock card HTML
        function createClockCard(timezone) {
            const now = new Date();
            const timeInZone = new Date(now.toLocaleString('en-US', { timeZone: timezone }));

            const time = formatTime(timeInZone);
            const date = timeInZone.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
            const day = timeInZone.toLocaleDateString('en-US', { weekday: 'long' });
            const offset = getTimezoneOffset(timezone);

            const region = timezone.split('/')[1]?.replace(/_/g, ' ') || timezone;
            const country = timezone.split('/')[0];

            return `
                <div class="clock-card">
                    <div class="timezone-name">${country}</div>
                    <div class="timezone-region">${region}</div>
                    <div class="offset">UTC ${offset}</div>
                    <div class="time-display ${isBlinking ? 'blinking' : ''}">${time}</div>
                    <div class="date-display">${date}</div>
                    <div class="day-display">${day}</div>
                    <div class="period">${timeInZone.getHours() >= 12 ? '🌙 PM' : '☀️ AM'}</div>
                    <button class="remove-btn" onclick="removeTimezone('${timezone}')">Remove</button>
                </div>
            `;
        }

        // Format time based on the selected format
        function formatTime(date) {
            let hours = date.getHours();
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');

            if (timeFormat === '12') {
                const period = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12;
                return `${String(hours).padStart(2, '0')}:${minutes}:${seconds}`;
            } else {
                return `${String(hours).padStart(2, '0')}:${minutes}:${seconds}`;
            }
        }

        // Get timezone offset
        function getTimezoneOffset(timezone) {
            const date = new Date();
            const utcDate = new Date(date.toLocaleString('en-US', { timeZone: 'UTC' }));
            const tzDate = new Date(date.toLocaleString('en-US', { timeZone: timezone }));
            const offset = (tzDate - utcDate) / (1000 * 60 * 60);
            const sign = offset >= 0 ? '+' : '';
            return `${sign}${offset.toFixed(1).replace('.0', '')}`;
        }

        // Add custom timezone
        function addCustomTimezone() {
            const input = document.getElementById('customTimezone').value.trim().toUpperCase();

            if (!input) {
                showMessage('Please enter a timezone');
                return;
            }

            // Convert common aliases
            const timezone = input.toLowerCase();

            if (!isValidTimezone(timezone)) {
                showMessage(`❌ Invalid timezone: ${input}`);
                return;
            }

            if (timezones.includes(timezone)) {
                showMessage(`⚠️ ${input} already added`);
                return;
            }

            timezones.push(timezone);
            localStorage.setItem('timezones', JSON.stringify(timezones));
            document.getElementById('customTimezone').value = '';
            renderClocks();
            updateStats();
            showMessage(`✅ ${input} added!`);
        }

        // Validate timezone
        function isValidTimezone(tz) {
            try {
                Intl.DateTimeFormat(undefined, { timeZone: tz });
                return true;
            } catch (e) {
                return false;
            }
        }

        // Add preset timezone
        function addPreset(timezone) {
            if (timezones.includes(timezone)) {
                showMessage(`⚠️ Already added`);
                return;
            }

            timezones.push(timezone);
            localStorage.setItem('timezones', JSON.stringify(timezones));
            renderClocks();
            updateStats();
            showMessage(`✅ Added!`);
        }

        // Remove timezone
        function removeTimezone(timezone) {
            timezones = timezones.filter(tz => tz !== timezone);
            localStorage.setItem('timezones', JSON.stringify(timezones));
            renderClocks();
            updateStats();
        }

        // Toggle time format
        function toggleFormat(format) {
            timeFormat = format;
            localStorage.setItem('timeFormat', format);
            document.querySelectorAll('.format-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderClocks();
        }

        // Toggle blinking
        function toggleBlinking() {
            isBlinking = !isBlinking;
            localStorage.setItem('isBlinking', isBlinking);
            setBlinkingState();
            renderClocks();
        }

        // Set blinking state
        function setBlinkingState() {
            document.querySelectorAll('.time-display').forEach(el => {
                if (isBlinking) {
                    el.classList.add('blinking');
                } else {
                    el.classList.remove('blinking');
                }
            });
        }

        // Show/hide presets menu
        function showPresets() {
            const menu = document.getElementById('presetsMenu');
            menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
        }

        // Clear all timezones
        function clearAll() {
            if (confirm('Are you sure you want to remove all timezones?')) {
                timezones = [];
                localStorage.setItem('timezones', JSON.stringify(timezones));
                renderClocks();
                updateStats();
                showMessage('🗑️ All timezones cleared');
            }
        }

        // Update stats
        function updateStats() {
            const count = timezones.length;
            document.getElementById('statsText').textContent = 
                `${count} timezone${count !== 1 ? 's' : ''} active`;
        }

        // Show message
        function showMessage(msg) {
            const div = document.createElement('div');
            div.className = 'success-message';
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 2500);
        }

        // Initialize on load
        window.addEventListener('load', init);
    </script>
</body>
</html>
